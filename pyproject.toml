[project]
name = "purchase-intent-xai"
version = "0.1.0"
description = "E-commerce purchase-intent prediction with explainable AI"
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: common bugs
select = ["E", "W", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
