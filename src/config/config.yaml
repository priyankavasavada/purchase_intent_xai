# Single source of truth for paths and parameters.
# Every module reads from here instead of hard-coding values.

project:
  random_seed: 42

paths:
  data_file: dataset/ecommerce_sessions.csv
  models_dir: models
  logs_dir: logs

data:
  target: Converted
  test_size: 0.2

features:
  # Right-skewed columns with many zeros: log1p first, then standard scaling.
  log_scaled:
    - Administrative
    - Administrative_Duration
    - Informational
    - Informational_Duration
    - ProductRelated
    - ProductRelated_Duration
    - PageValues
  # Already on a small, bounded range: standard scaling only.
  scaled:
    - BounceRates
    - ExitRates
    - SpecialDay
  # One-hot encoded. The int-coded IDs (OperatingSystems, Browser, Region,
  # TrafficType) are categories, not quantities, so they belong here.
  categorical:
    - Month
    - OperatingSystems
    - Browser
    - Region
    - TrafficType
    - VisitorType
    - Weekend
  # Built by src/features/engineering.py, then processed like the groups above.
  engineered_log_scaled:
    - total_pages
    - total_duration
    - avg_time_per_page
    - avg_time_per_product_page
  engineered_scaled:
    - product_page_share
    - product_time_share
  # Left out of the model: weak by both importance methods, with and without
  # PageValues, and removing them does not lower PR-AUC. See notebooks/02_features.
  dropped:
    - Administrative
    - Informational
    - VisitorType
    - Weekend
  # Left out to prevent data leakage. We score sessions mid-visit, and PageValues
  # mostly reflects pages seen on the way to checkout, so it is not known yet.
  # See notebooks/01_eda (leakage check) and docs/week2_notes.md.
  leakage_excluded:
    - PageValues

training:
  # How to deal with class imbalance: none | class_weight | smote
  # "none": SMOTE never helped and class weights only moved the precision/recall
  # trade-off, which the operating threshold handles. Without reweighting, the
  # predicted probabilities stay closer to real conversion chances.
  imbalance_strategy: none
  # Only used by the Week 1 baseline (train_baseline). The final model's default
  # threshold is set by train_final (best F1 on out-of-fold predictions), and the
  # CRO team picks the real operating point with src/models/threshold.py.
  baseline_threshold: 0.5
  cv_folds: 5
  # Random parameter combinations tried per model during tuning.
  tuning_iterations: 20

selection:
  # Times each column is shuffled when measuring permutation importance.
  permutation_repeats: 5
  # A column is only weak if its share of LightGBM gain is below this
  # (and its permutation importance is within the noise).
  min_gain_share: 0.01

api:
  # How many reasons /predict returns for each session.
  top_contributors: 5
  # Confidence label by distance from the threshold:
  # below low_below -> "low", below medium_below -> "medium", else "high".
  confidence_low_below: 0.1
  confidence_medium_below: 0.25

mlflow:
  # Local experiment log. Open it with: mlflow ui --backend-store-uri sqlite:///mlflow.db
  tracking_db: mlflow.db
  artifacts_dir: mlruns
  experiment: purchase-intent
  registered_model: purchase-intent
